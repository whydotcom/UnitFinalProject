<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="unit.css">
</head>
<body>      
    <button onclick="localStorage.clear()">Reset</button>

    <div class="highest-container">
        <img class="background-image" 
        src="appImages/vecteezy_pattern-pokeball-red-and-white-ball-of-the-popular-cartoon_24649105.jpg" 
        alt="https://www.vecteezy.com/vector-art/24649105-pattern-pokeball-red-and-white-ball-of-the-popular-cartoon-90s-pixel-art">
        <div class="background-container-1">

            <div class="dex-screen-0">
            </div>
            <span class="dex-bulb-1"></span>
            <span class="dex-bulb-2"></span>
            <div class="dex-screen-1">
                <div class="dex-screen-nav">
                    <div class="dex-nav-link-container">
                        <button class="dex-button-1" onclick="displayScreen(1)">Pokedex</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-2" onclick="displayScreen(2)">Catch</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-3" onclick="displayScreen(3)">PC</button>
                    </div>

                </div>  
                <div id="form-container">        
                    <form id="pokedex-form">
                        <input id="search" placeholder="Who's That Pokemon?" type="search" autocomplete="off">
                    </form>
                </div>
                <div id="suggestion-container"></div>  
                <div id="container"></div>
                <div class="minor-background-image-container">
                    <img class="minor-background-image" src="appImages/vecteezy_pokemon-ball-vector_117920 copy.png" alt="">
                </div>
                
            </div>
            <div class="dex-screen-2"> 
                <div class="minor-background-image-container">
                    <img class="minor-background-image" src="appImages/vecteezy_pokemon-ball-vector_117920 copy.png" alt="">
                </div>
                
                <div class="dex-screen-nav">
                    <div class="dex-nav-link-container">
                        <button class="dex-button-1" onclick="displayScreen(1)">Pokedex</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-2" onclick="displayScreen(2)">Catch</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-3" onclick="displayScreen(3)">PC</button>
                    </div>

                </div>
                <form id="pc-form" autocomplete="off">
                    <label for="pokemon-name">Name</label>
                    <input id="pokemon-name" required>

                    <div id="pc-suggestion-container"></div> 
                     
                    <label for="nickname">Nickname</label>
                    <input id="nickname" required>
                    <label for="move1">First Move</label>
                    <input id="move1" required> 
                    <label for="move2" >Second Move</label>
                    <input id="move2" required> 
                    <label for="move3">Third Move</label>
                    <input id="move3" required> 
                    <label for="move4">Fourth Move</label>
                    <input id="move4" required=> 

                    <button type="submit">Submit</button>
                </form>
                <div class="submission-message-container"></div>
            </div>
           
            <div class="dex-screen-3">
                <audio id="eterna-forest" src="Eterna-Forest.mp3"></audio>
                <div class="pc-ranch-img-container">
                    <img class="pc-ranch-img" src="appImages/Cartoon_green_texture_grass.jpg" alt="">
                </div>
                <div class="dex-screen-nav">
                    <div class="dex-nav-link-container">
                        <button class="dex-button-1" onclick="displayScreen(1)">Pokedex</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-2" onclick="displayScreen(2)">Catch</button>
                    </div>
                    <span></span>
                    <div class="dex-nav-link-container">
                        <button class="dex-button-3" onclick="displayScreen(3)">PC</button>
                    </div>


                </div>

                <div id="pc-container">
                     <div class="floating"></div>
                     <div class="floating"></div>
  
                </div>
            </div> 

        </div>

    </div>



    <script src="unit.js"></script>
    
</body>
</html>
